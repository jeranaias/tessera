name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build ./...

      - name: Unit tests (every pack's Rego rules)
        run: go test ./...

      - name: Build the tessera binary
        run: go build -o tessera ./cmd/tessera

      - name: MOSA example gate-fails as expected (exit 2)
        run: |
          set +e
          ./tessera --pack packs/mosa --manifest packs/mosa/examples/example-radio/manifest.yaml
          code=$?
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

      - name: cyber-rmf example gate-fails as expected (exit 2)
        run: |
          set +e
          ./tessera --pack packs/cyber-rmf --manifest packs/cyber-rmf/examples/example-system/manifest.yaml
          code=$?
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Adapter self-tests
        run: python adapters/sysmlv2/test_sysml2bom.py

      - name: End-to-end — derive manifest from a SysML v2 model, then gate
        run: |
          set +e
          python adapters/sysmlv2/sysml2bom.py adapters/sysmlv2/examples/radio.sysml \
            | ./tessera --pack packs/mosa --manifest -
          code=$?
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

      - name: Sign a receipt, then independently verify it
        run: |
          ./tessera check --pack packs/mosa \
            --manifest packs/mosa/examples/example-radio/manifest.yaml --out r.json || true
          ./tessera verify r.json

      - name: Waiver flow — a justified, attributed exception passes the gate
        run: |
          ./tessera check --pack packs/mosa \
            --manifest packs/mosa/examples/example-radio/manifest.yaml \
            --waivers packs/mosa/examples/example-radio/waivers.yaml

      - name: A tampered receipt is rejected (exit 3)
        run: |
          set +e
          sed 's/"pass": false/"pass": true/' r.json > faked.json
          ./tessera verify faked.json
          code=$?
          test "$code" -eq 3 || { echo "expected exit 3 for tampered receipt, got $code"; exit 1; }

      - name: A malformed manifest is rejected by schema validation (exit 1)
        run: |
          set +e
          printf 'mosaManifestVersion: "0.1"\nprogram: {id: P, name: "N"}\nmodules:\n  - {id: M1}\ninterfaces: []\n' > bad.yaml
          ./tessera check --pack packs/mosa --manifest bad.yaml
          code=$?
          test "$code" -eq 1 || { echo "expected exit 1 for malformed manifest, got $code"; exit 1; }
